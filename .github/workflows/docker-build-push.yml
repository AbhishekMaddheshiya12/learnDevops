name: Build, Push and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: task-manager-deployment
  cancel-in-progress: false

env:
  FRONTEND_IMAGE: devabhaym/devops-task-manager-frontend
  BACKEND_IMAGE: devabhaym/devops-task-manager-backend

jobs:
  # ---------------------------------------------
  # JOB 1: Build and push Docker images
  # ---------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  # ---------------------------------------------
  # JOB 2: Deploy to K3s Kubernetes
  # ---------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: self-hosted

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Update Kubernetes Deployments
        run: |
          set -e

          echo "Deploying commit: $IMAGE_TAG"

          sudo k3s kubectl set image deployment/frontend \
            devops-task-manager-frontend=${FRONTEND_IMAGE}:${IMAGE_TAG} \
            -n task-manager

          sudo k3s kubectl set image deployment/backend \
            devops-task-manager-backend=${BACKEND_IMAGE}:${IMAGE_TAG} \
            -n task-manager

      # ---------------------------------------------
      # Wait for rolling updates
      # ---------------------------------------------
      - name: Wait for Kubernetes rollouts
        run: |
          set -e

          sudo k3s kubectl rollout status deployment/frontend \
            -n task-manager --timeout=180s

          sudo k3s kubectl rollout status deployment/backend \
            -n task-manager --timeout=180s

      # ---------------------------------------------
      # Verify Kubernetes resources
      # ---------------------------------------------
      - name: Verify deployment
        run: |
          set -e

          echo "Checking Deployments..."

          sudo k3s kubectl get deployments -n task-manager

          echo "Checking Pods..."

          sudo k3s kubectl get pods -n task-manager

          echo "Checking frontend image..."

          sudo k3s kubectl get deployment frontend -n task-manager \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

          echo "Checking backend image..."

          sudo k3s kubectl get deployment backend -n task-manager \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

          echo "Checking application health..."

          curl --fail --silent --show-error \
            http://localhost:30080/api/health

          echo ""
          echo "Kubernetes deployment completed successfully!"