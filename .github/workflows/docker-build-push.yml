name: Build, Push and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  FRONTEND_IMAGE: devabhaym/devops-task-manager-frontend
  BACKEND_IMAGE: devabhaym/devops-task-manager-backend

jobs:
  # ---------------------------------------------
  # JOB 1: Build and push Docker images
  # ---------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  # ---------------------------------------------
  # JOB 2: Deploy on the Ubuntu VM
  # ---------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: self-hosted

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Deploy application
        run: |
          cd /home/vagrant/task-manager

          echo "Deploying image tag: $IMAGE_TAG"

          docker compose pull
          docker compose up -d

      # ---------------------------------------------
      # Verify deployment
      # ---------------------------------------------
      - name: Verify deployment
        run: |
          cd /home/vagrant/task-manager

          echo "Waiting for the application to become healthy..."

          for i in $(seq 1 15); do
            if curl --fail --silent http://localhost:8080/api/health; then
              echo ""
              echo "Application is healthy!"
              docker compose ps
              exit 0
            fi

            echo "Application not ready yet. Attempt $i/15"
            sleep 4
          done

          echo "Health check failed after 15 attempts."
          docker compose ps
          docker compose logs --tail=100
          exit 1